<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>i love zahara!</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#000;overflow:hidden;color:#fff}
body{font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.h{position:absolute;bottom:-60px;will-change:transform,opacity;filter:drop-shadow(0 0 6px rgba(255,90,160,.55))}
.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
h1{margin:0;font-size:clamp(30px,8vw,56px);font-weight:800;letter-spacing:1px;color:#ffd1e6;
text-shadow:0 0 8px #ff4f9a,0 0 22px #ff4f9a,0 0 44px #d6246e;text-align:center;padding:0 12px}
h1 span{display:inline-block;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}}
#cat{width:min(66vw,300px);height:auto;cursor:pointer;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,120,180,.35))}
@keyframes bob{50%{transform:translateY(-8px)}}
.tail{transform-origin:150px 150px;animation:wag 1.4s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(14deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.ear{transform-box:fill-box;transform-origin:bottom center;animation:twitch 5s infinite}
@keyframes twitch{0%,90%,100%{transform:rotate(0)}95%{transform:rotate(-8deg)}}
small{color:#ff9cc7;opacity:.7;font-size:13px;margin-top:4px}
.st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:.9;transform:scale(1.3)}}
.ss{position:absolute;height:2px;width:90px;background:linear-gradient(90deg,transparent,#fff,#ff9cc7);border-radius:2px;opacity:0}
#msg{min-height:22px;max-width:86vw;margin-top:10px;padding:9px 18px;border-radius:999px;background:rgba(255,79,154,.14);border:1px solid rgba(255,111,181,.4);color:#ffd1e6;font-size:16px;text-align:center;cursor:pointer;box-shadow:0 0 18px rgba(255,79,154,.2);user-select:none}
#wrap{position:relative;display:flex;justify-content:center;margin-top:34px}
#cat{width:min(70vw,320px);height:auto;cursor:pointer;animation:bob 3s ease-in-out infinite;filter:none;-webkit-user-drag:none;user-select:none}
.tiny{position:absolute;pointer-events:none;filter:drop-shadow(0 0 4px rgba(255,90,160,.7))}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
(function(){
var sky=document.getElementById('sky');
var fills=['url(#gloss)','url(#holo)','url(#peach)','url(#dots)','url(#stripes)','url(#plaid)','neon','glitter','gem'];
function heartSVG(kind){
  var inner;
  if(kind==='neon') inner='<use href="#hp" fill="rgba(255,60,140,.12)" stroke="#ff6fb5" stroke-width="2.4"/><use href="#hp" fill="none" stroke="#fff" stroke-width=".8" opacity=".8"/>';
  else if(kind==='glitter') inner='<use href="#hp" fill="url(#holo)"/><g fill="#fff"><circle cx="10" cy="9" r="1"/><circle cx="20" cy="7" r="1.2"/><circle cx="15" cy="15" r=".9"/><circle cx="23" cy="14" r="1"/><circle cx="13" cy="21" r=".8"/><circle cx="18" cy="23" r="1"/></g>';
  else if(kind==='gem') inner='<use href="#hp" fill="#ff4f93"/><path d="M16 28L9 9.5L2 9.5ZM16 28L23 9.5L30 9.5ZM16 28L9 9.5L16 6.5L23 9.5Z" fill="#fff" opacity=".18"/><path d="M9.5 2L9 9.5L16 6.5L22.5 2L23 9.5" fill="none" stroke="#fff" stroke-width=".8" opacity=".55"/>';
  else inner='<use href="#hp" fill="'+kind+'"/>';
  var shine=(kind==='neon')?'':'<ellipse cx="9.5" cy="8" rx="3.2" ry="2" fill="#fff" opacity=".7" transform="rotate(-30 9.5 8)"/>';
  return '<svg viewBox="0 0 32 29" width="100%" height="100%">'+inner+shine+'</svg>';
}
function spawn(x,y){
  var el=document.createElement('div'); el.className='h';
  var s=18+Math.random()*30;
  el.style.width=s+'px'; el.style.height=s*0.9+'px';
  var vw=window.innerWidth, vh=window.innerHeight, px;
  if(x!==undefined){px=x-s/2; el.style.bottom='auto'; el.style.top=(y-s/2)+'px';}
  else{
    var r=Math.random();
    if(r<.42) px=Math.random()*vw*.22; else if(r<.84) px=vw*.78+Math.random()*vw*.22-s; else px=Math.random()*(vw-s);
    px=Math.max(0,Math.min(vw-s,px));
  }
  el.style.left=px+'px';
  el.innerHTML=heartSVG(fills[Math.floor(Math.random()*fills.length)]);
  sky.appendChild(el);
  var rise=(x!==undefined)?(120+Math.random()*180):(vh*(.55+Math.random()*.5));
  var sway=(Math.random()-.5)*70, rot=(Math.random()-.5)*50, dur=(x!==undefined)?2200+Math.random()*1200:5000+Math.random()*4500;
  var a=el.animate([
    {transform:'translate(0,0) scale(.4) rotate('+(-rot)+'deg)',opacity:0},
    {opacity:.95,offset:.2},
    {transform:'translate('+sway+'px,'+(-rise)+'px) scale(1) rotate('+rot+'deg)',opacity:0}
  ],{duration:dur,easing:'ease-out'});
  a.onfinish=function(){el.remove()};
}
for(var i=0;i<14;i++) setTimeout(spawn,i*180);
setInterval(spawn,380);
var cat=document.getElementById('cat');
cat.addEventListener('click',function(e){
  var r=cat.getBoundingClientRect();
  for(var i=0;i<10;i++) spawn(r.left+Math.random()*r.width, r.top+Math.random()*r.height*.6);
  cat.animate([{transform:'scale(1)'},{transform:'scale(1.08) rotate(-3deg)'},{transform:'scale(1)'}],{duration:350});
  onTap();
});
document.addEventListener('pointerdown',function(e){ if(e.target!==cat) for(var i=0;i<4;i++) spawn(e.clientX+(Math.random()-.5)*40,e.clientY) });
var taps=0;function onTap(){taps++;if(taps%10===0)for(var i=0;i<70;i++)setTimeout(spawn,i*45)}
for(var k=0;k<60;k++){var d=document.createElement('div');d.className='st';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.animationDelay=(Math.random()*3)+'s';d.style.animationDuration=(2+Math.random()*3)+'s';sky.appendChild(d)}
function shoot(){
  var s=document.createElement('div');s.className='ss';
  var y=Math.random()*window.innerHeight*.4,x=Math.random()*window.innerWidth*.6;
  s.style.left=x+'px';s.style.top=y+'px';s.style.transform='rotate(25deg)';sky.appendChild(s);
  var a=s.animate([{opacity:0,transform:'translate(0,0) rotate(25deg)'},{opacity:1,offset:.2},{opacity:0,transform:'translate(260px,120px) rotate(25deg)'}],{duration:1100,easing:'ease-out'});
  a.onfinish=function(){s.remove()};
}
setInterval(shoot,6500);setTimeout(shoot,1500);

var wrap=document.getElementById('wrap');
function tiny(){
  var el=document.createElement('div');el.className='tiny';
  var sz=8+Math.random()*10;el.style.width=sz+'px';el.style.height=sz*.9+'px';
  el.style.left=(18+Math.random()*64)+'%';el.style.top=(-4+Math.random()*10)+'%';
  el.innerHTML=heartSVG(fills[Math.floor(Math.random()*fills.length)]);wrap.appendChild(el);
  var dx=(Math.random()-.5)*50,dy=-(50+Math.random()*70);
  var an=el.animate([{transform:'translate(0,0) scale(.5)',opacity:0},{opacity:1,offset:.25},{transform:'translate('+dx+'px,'+dy+'px) scale(1)',opacity:0}],{duration:1800+Math.random()*1400,easing:'ease-out'});
  an.onfinish=function(){el.remove()};
}
setInterval(tiny,260);
var t=document.getElementById('title'), txt='i love zahara!';
txt.split('').forEach(function(ch,i){var s=document.createElement('span');s.textContent=ch===' '?'\u00a0':ch;s.style.animationDelay=(i*0.09)+'s';t.appendChild(s)});
})();
</script>
